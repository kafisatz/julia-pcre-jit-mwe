name: mwe_regex

on:
  push:
  workflow_dispatch:

jobs:
  run:
    name: ${{ matrix.os }} / julia ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        version: ['1.13.1', '1.12', '1.10', 'nightly']
        include:
          - os: windows-2022
            version: '1.13.1'
          - os: ubuntu-latest
            version: '1.13.1'
          - os: macos-latest
            version: '1.13.1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: Run mwe_regex.jl 3 times
        shell: bash
        run: |
          set +e
          failures=0
          for i in 1 2 3; do
            echo "::group::attempt $i"
            julia --startup-file=no mwe_regex.jl
            code=$?
            echo "::endgroup::"
            echo "attempt $i: exit code $code"
            echo "- attempt $i: exit code \`$code\`" >> "$GITHUB_STEP_SUMMARY"
            [ $code -ne 0 ] && failures=$((failures+1))
          done
          echo "failures: $failures / 3"
          [ $failures -eq 0 ]
